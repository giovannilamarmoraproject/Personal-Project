name: personal-project-hub

services:
  personal-project-hub:
    image: ${DOCKER_REPOSITORY:-ghcr.io/giovannilamarmoraproject/personal-project}:${APP_VERSION:-latest}
    container_name: personal-project-hub
    hostname: personal-project-hub
    restart: unless-stopped
    ports:
      - 10010:80

    # Tutti i file del sito, dei sottoprogetti e la configurazione Nginx
    # sono gia' inclusi all'interno dell'immagine Docker generata da GitHub Actions.
    # Per sviluppo locale con hot-reload, scommentare la seguente riga:
    # volumes:
    #   - ./:/usr/share/nginx/html:ro

    labels:
      # 1. Attiva il monitoraggio di WUD (What's Up Docker)
      - "wud.watch=true"
      # 2. Monitora specificamente il tag latest
      - "wud.tag.include=^latest$"
      # 3. Controlla le variazioni di hash digest SHA-256
      - "wud.watch.digest=true"
      # 4. Attiva il trigger di deploy automatico
      - "wud.trigger.docker.local.enabled=true"
      # 5. Forza l'esecuzione automatica immediata al rilevamento
      - "wud.trigger.docker.local.auto=true"
      - "wud.trigger.docker.local.threshold=all"

    # Se Nginx Proxy Manager / NPMPlus e sulla stessa rete Docker:
    networks:
      docker-network:
        aliases:
          - personal-project-hub

networks:
  docker-network:
    external: true
