# ==============================================================================
# Nginx Dynamic Multi-Routing Configuration
# ==============================================================================

gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

# ------------------------------------------------------------------------------
# MAPPATURA DINAMICA DELLE CARTELLE
# ------------------------------------------------------------------------------

# 1. Header personalizzato opzionale passato da NPMPlus
#    Permette di impostare su NPMPlus qualsiasi dominio verso qualunque cartella
#    Esempio in NPMPlus: proxy_set_header X-Target-Folder "the-real-marza";
map $http_x_target_folder $folder_from_header {
    default $http_x_target_folder;
    "" "";
}

# 2. Sottodominio estratto automaticamente dal dominio (*.giovannilamarmora.com)
#    Se il sottodominio e project, projects, www, hub o vuoto -> root principale
map $subdomain $folder_from_subdomain {
    default $subdomain;
    "" "";
    "project" "";
    "projects" "";
    "www" "";
    "hub" "";
}

# 3. Cartella finale scelta: Se l'header e definito vince l'header, altrimenti il sottodominio
map $folder_from_header $final_folder {
    default $folder_from_header;
    "" $folder_from_subdomain;
}

# 4. Costruzione del percorso root
#    Se $final_folder e vuoto -> /usr/share/nginx/html (Hub Centrale)
#    Se $final_folder e the-real-marza -> /usr/share/nginx/html/the-real-marza
map $final_folder $folder_suffix {
    "" "";
    default "/$final_folder";
}

# ------------------------------------------------------------------------------
# SERVER BLOCK UNIFICATO E DINAMICO
# ------------------------------------------------------------------------------
server {
    listen 80 default_server;
    server_name ~^(?<subdomain>[a-zA-Z0-9_-]+)\.giovannilamarmora\.com$ projects.giovannilamarmora.com localhost _;

    root /usr/share/nginx/html$folder_suffix;
    index index.html;

    # Gestione file e routing SPA/Statico
    location / {
        try_files $uri $uri/ /index.html =404;
    }

    # Cache file statici (immagini, stili, script, icone)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|css|js|json)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
}
