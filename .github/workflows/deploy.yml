name: 🚀 Deploy Production

on:
  push:
    branches: [main, master]
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  validate:
    name: 🔍 Validate Project Files
    runs-on: ubuntu-latest
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v4

      - name: ⚙️ Validate JSON and Configs
        run: |
          python3 -m json.tool projects.json > /dev/null
          echo "projects.json is valid!"
          test -f index.html && echo "index.html exists!"
          test -f nginx.conf && echo "nginx.conf exists!"
          test -f Dockerfile && echo "Dockerfile exists!"

  build-and-push-ghcr:
    name: 🐳 Build & Push to GHCR
    runs-on: ubuntu-latest
    needs: validate
    permissions:
      contents: read
      packages: write
    outputs:
      release_version: ${{ steps.meta.outputs.release_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      image_name: ${{ steps.meta.outputs.image_name }}

    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v4

      - name: 📝 Set Release Metadata
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            VERSION="${TAG_NAME#v}"
          elif [ -f "VERSION" ]; then
            BASE_VERSION=$(cat VERSION | tr -d ' \r\n')
            VERSION="${BASE_VERSION}.${{ github.run_number }}"
            TAG_NAME="v${VERSION}"
          else
            VERSION="1.0.${{ github.run_number }}"
            TAG_NAME="v${VERSION}"
          fi

          IMAGE_NAME="ghcr.io/${{ github.repository }}"
          IMAGE_NAME_LOWER="${IMAGE_NAME,,}"

          echo "release_version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT
          echo "image_name=${IMAGE_NAME_LOWER}" >> $GITHUB_OUTPUT

          echo "Version: ${VERSION}"
          echo "Tag: ${TAG_NAME}"
          echo "Image: ${IMAGE_NAME_LOWER}"

      - name: 🔧 Set up QEMU (Multi-platform)
        uses: docker/setup-qemu-action@v3

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🚀 Build & Push Docker Image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ steps.meta.outputs.image_name }}:latest
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.release_version }}
            ${{ steps.meta.outputs.image_name }}:${{ steps.meta.outputs.tag_name }}

  create-release:
    name: 🏷️ Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build-and-push-ghcr
    permissions:
      contents: write
    steps:
      - name: "☁️ Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 📝 Generate Release Changelog
        id: changelog
        env:
          TAG_NAME: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          VERSION: ${{ needs.build-and-push-ghcr.outputs.release_version }}
          IMAGE_NAME: ${{ needs.build-and-push-ghcr.outputs.image_name }}
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            COMMITS=$(git log ${PREV_TAG}..HEAD --oneline --no-merges --pretty=format:"* %s (%h)")
          else
            COMMITS=$(git log -n 20 --oneline --no-merges --pretty=format:"* %s (%h)")
          fi

          cat <<EOF > release_notes.md
          # Personal Project Server ${TAG_NAME}

          Nuova versione del **Personal Project Server · Central Hub** compilata e distribuita con successo su GitHub Container Registry.

          ### 📦 Dettagli Rilascio
          - **Versione:** \`${VERSION}\`
          - **Tag:** \`${TAG_NAME}\`
          - **Immagine Docker:** \`${IMAGE_NAME}:${VERSION}\`
          - **Architetture supportate:** \`linux/amd64\`, \`linux/arm64\`

          ### 🛠️ Modifiche incluse
          ${COMMITS}
          EOF

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          name: ${{ needs.build-and-push-ghcr.outputs.tag_name }}
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

